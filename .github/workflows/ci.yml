name: CI

on:
  push:
    branches: [2.x]
  pull_request:
    branches: [2.x]
  workflow_dispatch:

permissions:
  contents: read

# A branch only needs its latest push checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.script }} (Craft ${{ matrix.dependencies }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        script: [check-cs, phpstan, test]
        # Both ends of the craftcms/cms constraint. Craft 6 is pre-release, so the
        # highest moves often, and that's where a token rename shows up first.
        dependencies: [highest, lowest]
        exclude:
          # Code style is ours alone; the Craft version can't affect it.
          - script: check-cs
            dependencies: lowest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # Which Craft got installed is the first thing to know from a failure.
      - name: Report the Craft version under test
        run: composer show craftcms/cms | head -3

      - run: composer ${{ matrix.script }}

  js:
    name: preferences script
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm test

  package:
    name: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      # No `composer install` above: validation reads the manifest, not the tree.
      # `--no-plugins` keeps `craftcms/plugin-installer` out of it, which errors on a
      # relative vendor path when it does get loaded.
      - run: composer validate --strict --no-plugins

      # `export-ignore` is easy to get wrong, and only ever wrong in the published
      # package, where it's least visible. This prints what an install would receive.
      - name: List what ships in the dist archive
        run: git archive --format=tar HEAD | tar --list | sort
